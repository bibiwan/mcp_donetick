services:
  mcp-donetick:
    # Published by CI on every v* tag, multi-arch (amd64 + arm64).
    # Pin a version instead of :latest if you want deploys to be deliberate.
    image: ghcr.io/bibiwan/mcp_donetick:latest
    # Uncomment to build locally instead of pulling. Note that a local build
    # skips the test suite that gates the published image.
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: mcp-donetick
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DONETICK_URL=${DONETICK_URL:-http://localhost:2021}
      - DONETICK_TOKEN=${DONETICK_TOKEN:-}
      - API_KEY=${API_KEY:-}
      - ACCESS_TOKEN=${ACCESS_TOKEN:-}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      # Resolves date-only inputs ("2026-08-30") to a local hour rather than
      # midnight UTC. Without this, "due tomorrow" lands at 00:00 UTC.
      - DONETICK_TIMEZONE=${DONETICK_TIMEZONE:-UTC}
      - DONETICK_DEFAULT_DUE_TIME=${DONETICK_DEFAULT_DUE_TIME:-18:00}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
