name: CI / CD & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Suite & Coverage
        run: npm test

      - name: Build TypeScript
        run: npm run build

  docker-publish:
    name: Build & Push Docker Image
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: actions/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm-publish:
    name: Publish to NPM (Optional)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Publish to NPM Registry
        if: env.NPM_AUTH_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Create GitHub Release
    needs: [docker-publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚀 DoneTick MCP Server ${{ github.ref_name }}

            First official production release of the **Model Context Protocol (MCP)** server for **DoneTick**.

            ### ✨ Key Features
            - **37 Specialized MCP Tools**: Complete coverage of Chores, Subtasks, Things (Sensors/Counters), Event Triggers, Labels (with auto-fallback), Projects, Circles, and Filters.
            - **HTTP SSE Stream Protocol**: Compatible with **Mistral Le Chat**, **Claude Desktop**, **LibreChat**, **n8n**, etc.
            - **OWASP Hardened**: Timing-safe token comparison, SSRF protocol protection, HTTP security headers, payload caps, and non-root Docker execution.
            - **Multi-Arch Docker Images**: Prebuilt for `linux/amd64` and `linux/arm64` on GitHub Packages (`ghcr.io/${{ github.repository }}:latest`).

            ### 🐳 Quick Pull & Run (Docker)
            ```bash
            docker run -d -p 3000:3000 \
              -e DONETICK_URL=http://your-donetick-host:2021 \
              --name mcp-donetick \
              ghcr.io/${{ github.repository }}:latest
            ```

            ### ⚡ Run directly via NPX
            ```bash
            npx mcp-donetick
            ```
